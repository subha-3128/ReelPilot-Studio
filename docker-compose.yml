services:
  reelpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reelpilot-studio
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REELPILOT_CLOUD_MODE=true
    volumes:
      # Persistent storage for SQLite database, original videos, voiceovers, and derivatives
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
