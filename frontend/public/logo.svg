<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E3A" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <!-- Accent Wave / Play Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EC4899" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle inner border -->
  <rect x="7" y="7" width="106" height="106" rx="27" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none" />

  <!-- 9:16 Vertical Video Frame -->
  <rect x="36" y="24" width="48" height="72" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" />

  <!-- Dynamic Voice-over Soundwaves Left -->
  <path d="M22 46v28" stroke="rgba(255,255,255,0.85)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M14 53v14" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round" />

  <!-- Dynamic Voice-over Soundwaves Right -->
  <path d="M98 46v28" stroke="rgba(255,255,255,0.85)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M106 53v14" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round" />

  <!-- Central Play / Studio Triangle -->
  <path d="M53 47.5L71 60L53 72.5V47.5Z" fill="url(#waveGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Top Video Notch / Camera Dot -->
  <circle cx="60" cy="31" r="2.5" fill="#EC4899" />
  
  <!-- Subtitle indicator line at bottom of phone frame -->
  <rect x="46" y="83" width="28" height="3" rx="1.5" fill="#FDE047" />
</svg>
